<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unmissable Deals</title>
</head>
<body>
    <h1 style="text-align: center; font-family: sans-serif;">🔥 Live Deals</h1>
    
    <div id="deals-container" style="max-width: 800px; margin: 0 auto; font-family: sans-serif;">
        <p style="text-align:center; color: #888;">Loading deals...</p>
    </div>

    <script>
        async function loadDeals() {
            try {
                // Fetch with timestamp to prevent caching
                const response = await fetch('deals.json?t=' + new Date().getTime());
                const deals = await response.json();
                const container = document.getElementById('deals-container');
                
                container.innerHTML = ''; 

                // Show newest deals first
                deals.slice().reverse().forEach(deal => {
                    const card = document.createElement('div');
                    card.style = "border: 1px solid #eee; padding: 20px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); background: #fff;";
                    
                    // Format description line breaks
                    const descHtml = deal.description.replace(/\n/g, '<br>');

                    card.innerHTML = `
                        <div style="color: #444; font-size: 16px; line-height: 1.6;">${descHtml}</div>
                        <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                            <span style="color: #999; font-size: 12px;">${deal.date}</span>
                            <a href="${deal.link}" target="_blank" style="background: #ff5722; color: white; padding: 10px 25px; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 14px;">
                                GET DEAL ➜
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error("Error loading deals:", e);
            }
        }
        loadDeals();
    </script>
</body>
</html>
